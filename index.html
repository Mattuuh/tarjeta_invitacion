<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed1c24">
    <title>Invitación | Mes Agustino</title>
    <link rel="stylesheet" href="css/estilos.css?v=1.0.5">
</head>
<body>
    <main class="pantalla pantalla-inicio">
        <section class="tarjeta tarjeta-inicio">
            <div class="marca-grupo">
                <img src="img/logo_jovenes_agustino.png" alt="Logo de Jóvenes Agustinos">
            </div>

            <p class="sobre-titulo">Agosto · Mes Agustino</p>
            <h1>¡Te ha llegado un invitación!</h1>
            <p class="frase-principal">
                “Nos hiciste, Señor, para ti, y nuestro corazón está inquieto hasta que descanse en ti.”
            </p>

            <input class="sobre-control" type="checkbox" id="abrir-sobre">

            <div class="escena-sobre">
                <div class="carta-interior">
                    <span>Una invitación preparada con el corazón</span>
                </div>

                <div class="sobre-animado" aria-hidden="true">
                    <div class="sobre-fondo"></div>
                    <div class="sobre-solapa"></div>
                    <div class="sobre-frente"></div>
                    <div class="sello-corazon">♥</div>
                </div>
            </div>

            <label class="boton boton-abrir" for="abrir-sobre">
                <span class="icono-carta">✉</span>
                <span>Abrir invitación</span>
            </label>

            <a href="mensaje.html" class="boton boton-continuar">
                Leer el mensaje <span aria-hidden="true">→</span>
            </a>

            <footer class="logos-institucionales">
                <img class="logo-osa" src="img/logo_OSA.png" alt="Logo de la Orden de San Agustín">
                <span class="separador"></span>
                <img class="lema-osa" src="img/lema_OSA.png" alt="Volver al corazón para caminar juntos hacia Dios">
            </footer>
        </section>
    </main>
</body>
</html>
